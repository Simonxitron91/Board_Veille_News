name: Mise à jour quotidienne du board

on:
  schedule:
    # 06:00 UTC = 08:00 (heure d'été Paris) / 07:00 (heure d'hiver Paris)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer les news et générer le JSON du jour
        run: python scripts/fetch_news.py

      - name: Publier les changements
        run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add data/*.json
          git diff --quiet --cached || git commit -m "Mise à jour automatique du $(date -u +%Y-%m-%d)"
          git push
